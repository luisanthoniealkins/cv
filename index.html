<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Luis Anthonie Alkins — Technical Architect and Technical Lead. View and download my CV.">
  <title>Luis Anthonie Alkins | CV</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #edf0f3; color: #202b36; font: 17px/1.6 Arial, sans-serif; }
    main { max-width: 780px; margin: 10vh auto; padding: 44px; background: white; border-radius: 12px; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 38px); line-height: 1.2; color: #152d3e; }
    .subtitle { margin: 0; color: #50616f; }
    h2 { margin: 0 0 8px; font-size: 23px; }
    article { margin-top: 32px; padding: 24px; border: 1px solid #d4dce2; border-radius: 8px; }
    article p { margin: 0 0 20px; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; }
    a { color: #234e66; text-underline-offset: 4px; }
    .button { display: inline-block; padding: 10px 17px; border: 1px solid #234e66; border-radius: 6px; text-decoration: none; }
    .primary { color: white; background: #234e66; }
    a:focus-visible, button:focus-visible { outline: 3px solid #e1a441; outline-offset: 4px; }
    .copy-email { padding: 0; border: 0; background: none; font: inherit; color: #234e66; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }
    #copy-status { display: block; margin-top: 6px; }
    footer { margin-top: 28px; font-size: 14px; color: #50616f; }
    @media(max-width: 600px) { main { margin: 20px 12px; padding: 26px; } article { padding: 20px; } }
  </style>
</head>
<body>
  <main>
    <h1>Luis Anthonie Alkins</h1>
    <p class="subtitle">Technical Architect &amp; Technical Lead · Jakarta, Indonesia</p>
    <article>
      <h2>Lead Backend CV</h2>
      <p>Architecture, engineering leadership, performance optimization, and cloud infrastructure experience. Updated October 2026.</p>
      <div class="links">
        <a class="button primary" href="backend/">View CV</a>
        <a class="button" href="files/lead-backend-oct-2026.pdf" download>Download PDF</a>
      </div>
    </article>
    <footer><a href="https://linkedin.com/in/luis-anthonie-alkins">LinkedIn</a> · <button type="button" class="copy-email" id="copy-email" aria-label="Copy email address">Email</button><span id="copy-status" role="status" aria-live="polite"></span></footer>
  </main>
  <script>
    const emailButton = document.getElementById('copy-email');
    const copyStatus = document.getElementById('copy-status');
    let resetTimer;
    emailButton.addEventListener('click', async () => {
      clearTimeout(resetTimer);
      try {
        await navigator.clipboard.writeText('luisanthoniealkins@gmail.com');
        emailButton.textContent = 'Copied!';
        copyStatus.textContent = 'Email address copied to clipboard.';
        resetTimer = setTimeout(() => {
          emailButton.textContent = 'Email';
          copyStatus.textContent = '';
        }, 3000);
      } catch {
        emailButton.textContent = 'Email';
        copyStatus.textContent = 'Copy manually: luisanthoniealkins@gmail.com';
      }
    });
  </script>
</body>
</html>
